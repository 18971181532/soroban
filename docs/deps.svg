<text x="612.0" y="87.0" font-size="13" fill="#0f766e" text-anchor="start" font-weight="bold" font-family="Consolas, monospace">D1</text>
<text x="612.0" y="103.0" font-size="9.5" fill="#857a6b" text-anchor="start" font-weight="normal" font-family="Consolas, monospace">=ROUND(C1,0)</text>
<text x="722.0" y="103.0" font-size="9.5" fill="#b45309" text-anchor="end" font-weight="normal" font-family="Consolas, monospace">72</text>
