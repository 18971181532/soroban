<text x="66.0" y="176.0" font-size="13" fill="#0f766e" text-anchor="start" font-weight="bold" font-family="Consolas, monospace">A2</text>
<text x="148.0" y="179.0" font-size="9.5" fill="#b45309" text-anchor="end" font-weight="normal" font-family="Consolas, monospace">18</text>
