<text x="612.0" y="249.0" font-size="9.5" fill="#857a6b" text-anchor="start" font-weight="normal" font-family="Consolas, monospace">=TEXT(C1,&quot;0.0%&quot;)</text>
<text x="768.0" y="249.0" font-size="9.5" fill="#b45309" text-anchor="end" font-weight="normal" font-family="Consolas, monospace">7200.0%</text>
<text x="30.0" y="300.0" font-size="9.5" fill="#857a6b" text-anchor="start" font-weight="normal" font-family="Inter, 'Segoe UI', 'Microsoft YaHei', sans-serif">箭头方向：被依赖 → 依赖它的公式。区域引用会展开成每一条边。</text>
