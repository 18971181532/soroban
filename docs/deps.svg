<text x="66.0" y="250.0" font-size="13" fill="#0f766e" text-anchor="start" font-weight="bold" font-family="Consolas, monospace">A3</text>
<text x="148.0" y="253.0" font-size="9.5" fill="#b45309" text-anchor="end" font-weight="normal" font-family="Consolas, monospace">30</text>
<rect x="212" y="140" width="146" height="54" rx="9" fill="#fffdf8" stroke="#e3dacb" stroke-width="1.2"/>
<text x="224.0" y="161.0" font-size="13" fill="#0f766e" text-anchor="start" font-weight="bold" font-family="Consolas, monospace">B1</text>
<text x="224.0" y="177.0" font-size="9.5" fill="#857a6b" text-anchor="start" font-weight="normal" font-family="Consolas, monospace">=SUM(A1:A3)</text>
<text x="348.0" y="177.0" font-size="9.5" fill="#b45309" text-anchor="end" font-weight="normal" font-family="Consolas, monospace">60</text>
