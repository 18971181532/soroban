<text x="408.0" y="175.0" font-size="9.5" fill="#857a6b" text-anchor="start" font-weight="normal" font-family="Consolas, monospace">=B1*1.2</text>
<text x="522.0" y="175.0" font-size="9.5" fill="#b45309" text-anchor="end" font-weight="normal" font-family="Consolas, monospace">72</text>
